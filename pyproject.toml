[project]
name = "enterprise-agent"
version = "0.5.0"
description = "Enterprise AI Operations Agent - durable HITL, MCP, vector RAG, optional observability, LangGraph (v0.5.0)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "openai>=1.40",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
]

# Optional deps live in [project.optional-dependencies] below.
# Offline CI (`pip install -e .`) must stay green without any of them.

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
observability = [
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "opentelemetry-exporter-otlp>=1.27",
]
langgraph = [
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
]
cache = ["redis>=5.0"]
tokenizer = ["tiktoken>=0.7"]
all = [
  "mcp>=1.2",
  "prometheus-client>=0.20",
  "opentelemetry-api>=1.27",
  "opentelemetry-sdk>=1.27",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "redis>=5.0",
  "tiktoken>=0.7",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "agent*", "infrastructure*", "integrations*", "knowledge*", "security*", "workflow*", "observability*", "evaluation*"]

[tool.setuptools.package-data]
workflow = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
