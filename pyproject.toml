[project]
name = "enterprise-agent"
version = "0.5.9"
description = "Enterprise AI Operations Agent - framework-native LangGraph runtime, system/workflow analysis, durable HITL, MCP, RAG"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.2",
  "pydantic-settings>=2.16.2",
  "python-dotenv>=1.2.2",
  "httpx>=0.28.1",
  "openai>=3.42.1",
  "langgraph>=1.2.19",
  "langchain-core>=1.4.7,<2",
  "tenacity>=9.0.0",
  "prometheus-client>=0.26.0",
  "paramiko>=3.4,<5",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1.post1",
  "sqlalchemy>=2.1.6",
  "psycopg[binary]>=3.3.7",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
]

# Optional integrations live in [project.optional-dependencies] below.
# Orchestration, tools, retries, and metrics are framework-backed required
# dependencies; only the Postgres checkpointer remains in the langgraph extra.

[project.optional-dependencies]
mcp = ["mcp>=2.3.0"]
observability = [
  "opentelemetry-api>=1.45.2",
  "opentelemetry-sdk>=1.45.2",
  "opentelemetry-exporter-otlp>=1.45.2",
]
langgraph = ["langgraph-checkpoint-postgres>=3.2.0"]
cache = ["redis>=8.1.0"]
tokenizer = ["tiktoken>=0.14.0"]
dev = ["ruff>=0.9.0", "mypy>=1.15.0"]
all = [
  "mcp>=2.3.0",
  "opentelemetry-api>=1.45.2",
  "opentelemetry-sdk>=1.45.2",
  "opentelemetry-exporter-otlp>=1.45.2",
  "langgraph-checkpoint-postgres>=3.2.0",
  "redis>=8.1.0",
  "tiktoken>=0.14.0",
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "agent*", "analysis*", "infrastructure*", "integrations*", "knowledge*", "security*", "workflow*", "observability*", "evaluation*"]

[tool.setuptools.package-data]
workflow = ["data/*.json"]
"agent.assistance" = ["models/*.joblib", "data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = false
