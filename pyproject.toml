[project]
name = "enterprise-agent"
version = "0.5.4"
description = "Enterprise AI Operations Agent - durable HITL, MCP, vector RAG, optional observability, LangGraph (v0.5.1)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.162.0",
  "uvicorn[standard]>=0.54.0",
  "pydantic>=2.14.2",
  "pydantic-settings>=2.16.2",
  "httpx>=0.28.1",
  "openai>=3.42.1",
  "pytest>=9.2.0",
  "pytest-asyncio>=1.4.1.post1",
  "sqlalchemy>=2.1.6",
  "psycopg[binary]>=3.3.7",
]

# Optional deps live in [project.optional-dependencies] below.
# Offline CI (`pip install -e .`) must stay green without any of them.

[project.optional-dependencies]
mcp = ["mcp>=2.3.0"]
observability = [
  "prometheus-client>=0.26.0",
  "opentelemetry-api>=1.45.2",
  "opentelemetry-sdk>=1.45.2",
  "opentelemetry-exporter-otlp>=1.45.2",
]
langgraph = [
  "langgraph>=1.2.19",
  "langgraph-checkpoint-postgres>=3.2.0",
]
cache = ["redis>=8.1.0"]
tokenizer = ["tiktoken>=0.14.0"]
all = [
  "mcp>=2.3.0",
  "prometheus-client>=0.26.0",
  "opentelemetry-api>=1.45.2",
  "opentelemetry-sdk>=1.45.2",
  "opentelemetry-exporter-otlp>=1.45.2",
  "langgraph>=1.2.19",
  "langgraph-checkpoint-postgres>=3.2.0",
  "redis>=8.1.0",
  "tiktoken>=0.14.0",
]

[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["apps*", "agent*", "infrastructure*", "integrations*", "knowledge*", "security*", "workflow*", "observability*", "evaluation*"]

[tool.setuptools.package-data]
workflow = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
